# A-Share-Review data layer Alembic configuration
# Usage: alembic -c apps/api/alembic.ini upgrade head
# DB path comes from ashare_review.config (env ASHARE_DB_PATH overrides),
# default: storage/db/ashare_review.db (gitignored).
# NOTE: keep this file ASCII-only (alembic reads it with locale encoding).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os
# sqlalchemy.url is injected by env.py (or overridden in tests)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
